<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plague Village - Intro/Arrival</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        html, body {
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body>
    <!-- Plague Village Menu, Entry Point for the Game -->
    <div id="mainMenu">
        <img src="plagueVillageMenu.png" id="menuImage">
        <button id="startGameBtn" class="glow-btn">Start</button>
    </div>

    <!-- Arrival Scene (Scene 1), Activated after Player clicks Start Button in Menu -->
    <div id="arrivalScene">
        <img id="plagueDoctor" src="plagueDoctor.png">
        <img id="villager1" src="villager1.png">
        <img id="worriedVillagerWoman" src="worriedVillagerWoman.png">

        <!-- Dialogue System (Character Name, Dialogue Text, Player Choices, Next Arrow for Navigation) -->
        <div id="dialogueBox">
            <div id="characterName">Desperate Villager:</div>
            <div id="dialogueText"></div>
            <div id="choiceBox">
                <button class="choiceBtn" data-choice="villagers">
                    Ask about the sick villagers
                </button>
                <button class="choiceBtn" data-choice="rats">
                    Ask about the rats
                </button>
                <button class="choiceBtn" data-choice="supplies">
                    Inspect your medical supplies
                </button>
            </div>
            <div id="nextArrow">➤</div>
        </div>
 

        <!-- Music Button and Link to MP3 -->
        <button id="turn-music-on">Music On</button>

        <!-- Inventory Button (Hidden Until Supplies are Checked) -->
        <button id="inventoryBtn">Inventory</button>
        <span id="inventoryHintArrow">➤</span>

        <!-- Pause Screen Button -->
         <button id="pause-screen-Btn">Menu</button>

        <!-- Inventory -->
        <div id="inventoryPanel" style="display: none;">
            <h3>Inventory</h3>
            <div id="inventoryItems">
                <!-- Items will be randomly generated and dynamically added later -->
            </div>
        </div>

    </div>

    <div id="pauseScreen">
        <img src="pauseMenuBackground.jpg" id="pauseImage">
        <button id="resumeBtn">Resume</button>
    </div>  

    <!-- Game Audio -->
    <audio id="bgm" src="arrivalMusic.mp3" autoplay loop></audio>

    <!-- Typing Sounds -->
    <audio class="typeSound" src="type1.ogg" preload="auto"></audio>
    <audio class="typeSound" src="type2.ogg" preload="auto"></audio>
    <audio class="typeSound" src="type3.ogg" preload="auto"></audio>
    <audio class="typeSound" src="type4.ogg" preload="auto"></audio>
    <audio class="typeSound" src="type5.ogg" preload="auto"></audio>
    <audio class="typeSound" src="type6.ogg" preload="auto"></audio>
    <audio class="typeSound" src="type7.ogg" preload="auto"></audio>
    <audio class="typeSound" src="type8.ogg" preload="auto"></audio>
    <audio class="typeSound" src="type9.ogg" preload="auto"></audio>
    <audio class="typeSound" src="type10.ogg" preload="auto"></audio>

    <!--Plague rat 1 image-->
    <img id="plagueRat" src="PlagueRat.png">








    <!-- JavaScript -->
    <script src="script.js">
        







    </script>
</body>

</html>
